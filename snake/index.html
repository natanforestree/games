<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #1c1917;
      color: #f5f5f4;
      font: 16px/1.4 system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    a { color: #a8a29e; }
    .hud { display: flex; gap: 24px; width: min(90vw, 480px); justify-content: space-between; }
    canvas {
      width: min(90vw, 480px);
      aspect-ratio: 1;
      background: #a8cf66;
      border: 4px solid #2a2f26;
      border-radius: 8px;
      /* The sprites are pixel art; keep them crisp when the canvas is scaled. */
      image-rendering: pixelated;
    }
    .msg { color: #a8a29e; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="hud">
    <a href="../">&larr; All games</a>
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="msg" id="msg">Press an arrow key or swipe to start</div>

  <script>
    const CELLS = 20;
    const SIZE = 480 / CELLS;
    const TICK_MS = 110;

    // Sprite sheet made in Aseprite by art/snake-sprites.lua: 12x12 tiles, drawn at 2x.
    // Columns are rotations (right, down, left, up); the rows are listed in that script.
    const T = 12;
    const ROW = { head: 0, headDead: 1, tail: 2, straight: 3, corner: 4, cornerSpot: 5, ground: 6, decor: 7 };
    const sheet = new Image();
    sheet.src = 'sprites.png';
    sheet.onload = () => { buildGround(); draw(); };

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const msgEl = document.getElementById('msg');

    let best = 0;
    try { best = Number(localStorage.getItem('snake-best')) || 0; } catch {}
    bestEl.textContent = best;

    let snake, dir, queued, food, score, running, over, timer;
    // Each segment keeps its id for life, so the spot pattern stays put on the body as it moves.
    let nextId = 0;
    let ground = null;

    function reset() {
      snake = [{ x: 9, y: 10, id: 2 }, { x: 8, y: 10, id: 1 }, { x: 7, y: 10, id: 0 }];
      nextId = 3;
      dir = { x: 1, y: 0 };
      queued = [];
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      if (queued.length) dir = queued.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y, id: nextId++ };
      const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      // The tail moves out of the way this tick, so it isn't a collision.
      const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function tile(target, col, row, x, y) {
      target.drawImage(sheet, col * T, row * T, T, T, x * SIZE, y * SIZE, SIZE, SIZE);
    }

    // Grass checkerboard with a few flowers, tufts and pebbles, drawn once per page load.
    function buildGround() {
      ground = document.createElement('canvas');
      ground.width = ground.height = canvas.width;
      const g = ground.getContext('2d');
      g.imageSmoothingEnabled = false;
      for (let y = 0; y < CELLS; y++) {
        for (let x = 0; x < CELLS; x++) {
          tile(g, (x + y) % 2, ROW.ground, x, y);
          if (Math.random() < 0.1) tile(g, Math.floor(Math.random() * 4), ROW.decor, x, y);
        }
      }
    }

    // Rotation index of a one-cell step, matching the sheet's columns.
    function rot(from, to) {
      const dx = to.x - from.x, dy = to.y - from.y;
      return dx === 1 ? 0 : dy === 1 ? 1 : dx === -1 ? 2 : 3;
    }

    function draw() {
      if (!ground) return; // sprites still loading; onload draws
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(ground, 0, 0);
      tile(ctx, 3, ROW.ground, food.x, food.y); // apple's shadow
      tile(ctx, 2, ROW.ground, food.x, food.y);

      const last = snake.length - 1;
      snake.forEach((s, i) => {
        if (i === 0) return tile(ctx, rot(snake[1], s), over ? ROW.headDead : ROW.head, s.x, s.y);
        if (i === last) return tile(ctx, rot(s, snake[i - 1]), ROW.tail, s.x, s.y);
        const a = rot(s, snake[i - 1]), b = rot(s, snake[i + 1]);
        const spotted = s.id % 2 === 0;
        if ((a + 2) % 4 === b) return tile(ctx, (a % 2) + (spotted ? 2 : 0), ROW.straight, s.x, s.y);
        // The unrotated corner joins left (2) and up (3); find the quarter turn that matches.
        const first = (b - a + 4) % 4 === 1 ? a : b;
        tile(ctx, (first + 2) % 4, spotted ? ROW.cornerSpot : ROW.corner, s.x, s.y);
      });
    }

    function gameOver() {
      clearInterval(timer);
      running = false;
      over = true;
      draw(); // show the crash face
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snake-best', best); } catch {}
      }
      msgEl.textContent = `Game over! Score ${score}. Press a direction to play again.`;
    }

    function turn(next) {
      if (!running) {
        if (over) {
          over = false;
          reset();
        }
        running = true;
        msgEl.textContent = '';
        timer = setInterval(step, TICK_MS);
      }
      // Compare against the last queued direction so quick double-taps can't reverse into yourself.
      const last = queued.length ? queued[queued.length - 1] : dir;
      if (next.x === -last.x && next.y === -last.y) return;
      if (next.x === last.x && next.y === last.y) return;
      if (queued.length < 3) queued.push(next);
    }

    const KEYS = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
    };
    document.addEventListener('keydown', e => {
      const next = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
      if (!next) return;
      e.preventDefault();
      turn(next);
    });

    let touchStart = null;
    document.addEventListener('touchstart', e => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    document.addEventListener('touchend', e => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      turn(Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) });
    });

    reset();
  </script>
</body>
</html>
