<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #1c1917;
      color: #f5f5f4;
      font: 16px/1.4 system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    a { color: #a8a29e; }
    .hud { display: flex; gap: 24px; width: min(90vw, 480px); justify-content: space-between; }
    canvas {
      width: min(90vw, 480px);
      aspect-ratio: 1;
      background: #292524;
      border-radius: 8px;
    }
    .msg { color: #a8a29e; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="hud">
    <a href="../">&larr; All games</a>
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="msg" id="msg">Press an arrow key or swipe to start</div>

  <script>
    const CELLS = 20;
    const SIZE = 480 / CELLS;
    const TICK_MS = 110;

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const msgEl = document.getElementById('msg');

    let best = 0;
    try { best = Number(localStorage.getItem('snake-best')) || 0; } catch {}
    bestEl.textContent = best;

    let snake, dir, queued, food, score, running, over, timer;

    function reset() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = { x: 1, y: 0 };
      queued = [];
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      if (queued.length) dir = queued.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      // The tail moves out of the way this tick, so it isn't a collision.
      const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * SIZE, (food.y + 0.5) * SIZE, SIZE * 0.4, 0, Math.PI * 2);
      ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
        ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
      });
    }

    function gameOver() {
      clearInterval(timer);
      running = false;
      over = true;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('snake-best', best); } catch {}
      }
      msgEl.textContent = `Game over! Score ${score}. Press a direction to play again.`;
    }

    function turn(next) {
      if (!running) {
        if (over) reset();
        over = false;
        running = true;
        msgEl.textContent = '';
        timer = setInterval(step, TICK_MS);
      }
      // Compare against the last queued direction so quick double-taps can't reverse into yourself.
      const last = queued.length ? queued[queued.length - 1] : dir;
      if (next.x === -last.x && next.y === -last.y) return;
      if (next.x === last.x && next.y === last.y) return;
      if (queued.length < 3) queued.push(next);
    }

    const KEYS = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
    };
    document.addEventListener('keydown', e => {
      const next = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
      if (!next) return;
      e.preventDefault();
      turn(next);
    });

    let touchStart = null;
    document.addEventListener('touchstart', e => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    document.addEventListener('touchend', e => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      turn(Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) });
    });

    reset();
  </script>
</body>
</html>
