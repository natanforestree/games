<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <style>
    :root {
      --bg: #fafaf9;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #2563eb;
      --thumb: #eef4e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #292524;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #44403c;
        --accent: #60a5fa;
        --thumb: #2f3a2b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
    }
    main { max-width: 800px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .intro { margin: 0 0 32px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      padding: 0;
      list-style: none;
    }
    .card {
      display: block;
      height: 100%;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
    .card .thumb {
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--thumb);
      border-radius: 8px;
    }
    /* Pixel art is drawn tiny and scaled up by whole numbers; keep the pixels crisp. */
    .card .thumb img { width: 144px; height: 144px; image-rendering: pixelated; }
    .card h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <p class="intro">Little things I've built. Click one to play.</p>

    <!-- To add a game: put it in its own folder with an index.html (and a 48x48 icon.png), then add a card here. -->
    <ul class="grid">
      <li>
        <a class="card" href="./snake/">
          <div class="thumb"><img src="./snake/icon.png" alt="" width="48" height="48"></div>
          <h2>Snake</h2>
          <p>Eat, grow, don't bite yourself. Arrow keys, WASD, or swipe.</p>
        </a>
      </li>
      <li>
        <a class="card" href="./marrow/">
          <div class="thumb"><img src="./marrow/icon.png" alt="" width="48" height="48"></div>
          <h2>Marrow</h2>
          <p>A one-hit-kill duel through three nightmare worlds. Keyboard: A/D move, W/S stance, F attack, G jump.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
