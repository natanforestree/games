<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marrow</title>
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0807; }
    body { display: grid; place-items: center; overflow: hidden; }
    canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
    a.back { position: fixed; top: 8px; left: 10px; color: #6f6452; font: 12px/1 Silkscreen, monospace; text-decoration: none; }
    a.back:hover, a.back:focus { color: #cdbf9f; }
  </style>
</head>
<body>
  <a class="back" href="../">← games</a>
  <canvas id="game" width="320" height="180" aria-label="Marrow: a sword-fighting game for the keyboard"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
